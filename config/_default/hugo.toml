# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://alguiensasaki.net/"
theme = "congo"
defaultContentLanguage = "en"


enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = true
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true
  [privacy.disqus]
    privacy.disqus.anonymizeIP = true

[services]
  [services.disqus]
    shortname = 'alguiensasaki'
  [services.x]
    disableInlineCSS = true


